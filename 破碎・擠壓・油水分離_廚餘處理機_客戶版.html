<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>破碎・擠壓・油水分離 廚餘處理機</title>
<style>/* Drafting sheet chrome. Colours sampled from the reference film at native res.

   THE SHEET IS A STATE, AND THIS FILE IS WHERE IT BECOMES A LAYOUT.

   `render/chrome.mjs` writes what is true — which panels are open, which
   overlays are on, whether the picture is moving — onto `#sheet` as data
   attributes, and never positions anything. Everything about where things go,
   and what "open" even looks like at a given width, is decided here.

   Two consequences worth knowing before editing:

   - The OPENING state of each panel is declared here too, as `--panel-key`,
     `--panel-instr`, `--panel-tb`. `chrome.mjs` reads those back and applies
     them, including again after a resize crosses a breakpoint. So changing
     which panels a layout starts with is a one-line change in this file.

   - `dev/chrome-lab.html` renders a real built page at each breakpoint, in both
     languages, with the views and motions drivable — which is where any change
     in here should be looked at before it ships.
*/

:root {
  --paper:      #eaeef2;
  --paper-hi:   #f0f3f6;
  --panel:      #eef2f6;
  --panel-head: #e2e8f0;
  --ink:        #1b2745;
  --ink-soft:   #5e6b87;
  --label:      #8792a6;
  --accent:     #a82629;
  /* The one colour on the sheet that is not drafting ink or the red used for
     live values: the droplet in the mark. Pulled toward the paper's blue-grey
     so it reads as part of the sheet rather than as pasted-in artwork. */
  --brand:      #2b86bd;
  --active:     #253951;
  --rule:       #1b2745;

  --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", "Cascadia Mono",
          Menlo, Consolas, "Liberation Mono", monospace, var(--cjk);

  /* Chinese falls through to here, glyph by glyph: Latin still comes out of the
     mono face above and only the CJK characters come from this list. System
     faces only — the sheet is offline and will never fetch a font. */
  --cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
         "Source Han Sans SC", "WenQuanYi Micro Hei", sans-serif;

  --pad: clamp(14px, 1.6vw, 26px);
  --fs-micro: clamp(8px, 0.62vw, 10.5px);
  --fs-small: clamp(9.5px, 0.72vw, 12px);
  --fs-body:  clamp(10px, 0.78vw, 13px);
  --fs-title: clamp(13px, 1.05vw, 18px);

  /* Glyph size and the square a console button occupies. A finger needs the
     larger one; these are raised at the touch breakpoints rather than here, so
     a desk keeps the drawing-instrument scale it has always had. */
  --ic: 17px;
  --hit: 30px;

  /*
     Whether an open panel sits BESIDE the drawing or ON TOP of it.

     A width question, so it is answered here, and read back by `chrome.mjs` the
     same way the opening states are — the runtime needs the answer because an
     overlay changes what the annotation layer should even attempt. See the
     phone breakpoint.
  */
  --panel-overlay: no;

  /*
     Whether the hover card FOLLOWS the pointer or is DOCKED to an edge.

     Also a width question, and also read back by `chrome.mjs`, for a sharper
     reason than the one above: a docked card is placed by `bottom` here, and a
     followed card is placed by `top` from there. A `position: fixed` box given
     both, with no height of its own, stretches to span them — so the card that
     should have named one part filled half the screen. The two must not be able
     to disagree, so there is one declaration and the runtime reads it.
  */
  --card-docked: no;

  /*
     Whether the item numbering is drawn before anyone asks.

     On is right wherever there is room for the gutters, which is the whole
     point of a numbered drawing. On a phone held upright the gutters are a
     fifth of a narrow screen and the drawing pays for them — so there it starts
     off, the framing takes the margin back, and the toolbar's numbering button
     puts it right back. Read by `chrome.mjs` like the two above.
  */
  --layer-callouts: on;

  --ease: cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
}

#sheet { position: fixed; inset: 0; }

#stage {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  /* The browser would otherwise claim a two-finger gesture for a page zoom and
     fire `pointercancel` at the runtime mid-pinch. There is nothing on this
     page to pan or zoom except the model, so it takes every gesture. */
  touch-action: none;
}

#ann {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  overflow: visible;
}

/*
   Catches a press anywhere outside an open drawer, so "put this away" does not
   arrive at the canvas as "orbit the model". Only exists while a drawer is
   open — see the phone breakpoint, which is the only width that has drawers.
*/
#scrim {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 5;
  background: none;
}

/* ---------------------------------------------------------------- sheet frame */

.frame {
  position: absolute;
  inset: calc(var(--pad) * 0.75);
  border: 1px solid #b9c6d6;
  pointer-events: none;
}
.frame::after {
  content: '';
  position: absolute;
  inset: 9px;
  border: 1px solid #ccd7e3;
}

.zone {
  position: absolute;
  font-size: var(--fs-micro);
  letter-spacing: .16em;
  color: #9fb0c4;
  pointer-events: none;
}

/* ------------------------------------------------------------------- headings */

.brand {
  position: absolute;
  left: calc(var(--pad) * 1.9); top: calc(var(--pad) * 1.5);
  display: flex; align-items: center; gap: 10px;
}
.brand .mark { width: 28px; height: 28px; flex: none; }
/*
   Not uppercased and not widely tracked, in either language. The signature is
   a name with Chinese and Latin in one line: uppercase would only shout at the
   Latin half, and drafting-width tracking would pull the four characters apart
   into four words.
*/
.brand .sig {
  font-size: var(--fs-body); font-weight: 700;
  letter-spacing: .08em;
}
.brand .division {
  font-size: var(--fs-micro); letter-spacing: .13em;
  color: var(--label); margin-top: 3px;
}

.docTitle {
  position: absolute;
  right: calc(var(--pad) * 1.9); top: calc(var(--pad) * 1.5);
  text-align: right;
  max-width: 46vw;
}
.docTitle .t {
  font-size: var(--fs-title); font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
}
.docTitle .s {
  font-size: var(--fs-micro); letter-spacing: .1em;
  color: var(--label); margin-top: 4px;
}

/*
   LANGUAGE, docked with the panel handles rather than in the toolbar.

   Not for the room — it hands 104px back to a rail that still scrolls without
   it. Because it is a different kind of control: everything in the toolbar
   changes what you are looking at, and this changes what it is written in.
   Grouped with the handles, in the same square ink-ruled idiom, it reads as a
   property of the sheet, which is what it is.
*/
#langDock {
  position: absolute;
  right: calc(var(--pad) * 1.9);
  top: calc(var(--pad) * 4.5);
  z-index: 8;
}
#langDock { display: flex; gap: 5px; }
#langDock .btn { min-width: var(--hit); padding: 0 9px; }
/* Every language, current one lit — the form for a sheet with room for it. */
#langDock .langAll { display: flex; gap: 5px; }
#langDock .langCycle { display: none; }

/* --------------------------------------------------------------------- panels */

.panel {
  position: absolute;
  background: color-mix(in srgb, var(--panel) 93%, transparent);
  border: 1.4px solid var(--rule);
  backdrop-filter: blur(1px);
  transition: opacity .22s var(--ease), transform .22s var(--ease),
              visibility .22s, width .22s var(--ease);
}
.panel > h2 {
  margin: 0;
  padding: 5px 12px 4px 5px;
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: .24em;
  text-transform: uppercase;
  background: var(--panel-head);
  border-bottom: 1.4px solid var(--rule);
  display: flex; align-items: center; gap: 7px;
}

/* The handle on a panel's own header. Square, ink-ruled, the same object as a
   console button — because when the panel is folded away that is exactly what
   it becomes. */
.panelToggle {
  flex: none;
  width: var(--hit); height: var(--hit);
  display: grid; place-items: center;
  padding: 0; margin: 0;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
  transition: background .12s, color .12s;
}
.panelToggle:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.panelToggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ic { width: var(--ic); height: var(--ic); display: block; }

/* ------------------------------------------------------------- panel, folded */

/*
   A shut panel is not hidden — it is the same panel reduced to its handle, and
   it stays exactly where it was, so opening it again does not make anything
   else on the sheet move. The heading text stays in the document: it is what a
   screen reader announces for the handle, and what the quality gate reads back
   to prove the language switch reached this panel.
*/
#sheet[data-panel-key="shut"]   #key,
#sheet[data-panel-instr="shut"] #instr,
#sheet[data-panel-tb="shut"]    #titleblock {
  width: auto;
  min-width: 0;
  background: none;
  border: 0;
  backdrop-filter: none;
}
#sheet[data-panel-key="shut"]   #key > h2,
#sheet[data-panel-instr="shut"] #instr > h2,
#sheet[data-panel-tb="shut"]    #titleblock > h2 {
  padding: 0;
  background: var(--paper-hi);
  border: 1.2px solid var(--ink);
}
#sheet[data-panel-key="shut"]   #key > h2 .h2Text,
#sheet[data-panel-instr="shut"] #instr > h2 .h2Text,
#sheet[data-panel-tb="shut"]    #titleblock > h2 .h2Text,
#sheet[data-panel-key="shut"]   #key > .panelBody,
#sheet[data-panel-instr="shut"] #instr > .panelBody,
#sheet[data-panel-tb="shut"]    #titleblock > .panelBody {
  /* `clip` rather than `display: none`: the text has to stay measurable to
     assistive technology, and it costs nothing to keep it. */
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* key to items ------------------------------------------------------------- */

#key {
  left: calc(var(--pad) * 1.9);
  top: calc(var(--pad) * 4.5);
  width: clamp(250px, 23vw, 400px);
}
#key .items {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px 0;
  padding: 9px 4px 9px 10px;
}
#key .item {
  display: flex; align-items: center; gap: 7px;
  font-size: var(--fs-small);
  padding: 2px 6px 2px 0;
  border-radius: 2px;
  transition: background .12s;
}
#key .item.hot { background: color-mix(in srgb, var(--accent) 16%, transparent); }
#key .item.hot .bal { border-color: var(--accent); color: var(--accent); }
#key .item.hot .tx { color: var(--accent); }
#key .items.single { grid-template-columns: 1fr; }

.bal {
  flex: none;
  width: 17px; height: 17px;
  border: 1.3px solid var(--ink);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: var(--fs-micro); font-weight: 700;
  line-height: 1;
}
#key .tx { line-height: 1.25; }

#key .meta {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 6px 12px 7px;
  border-top: 1.4px solid var(--rule);
  font-size: var(--fs-micro);
  letter-spacing: .1em;
  color: var(--label);
  text-transform: uppercase;
}
#key .meta b { color: var(--ink); font-weight: 700; margin-left: 5px; }

/* instrumentation ---------------------------------------------------------- */

#instr {
  right: calc(var(--pad) * 1.9);
  top: calc(var(--pad) * 4.5);
  width: clamp(210px, 18vw, 320px);
}
#instr .rows { padding: 8px 12px 9px; }
#instr .row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px;
  font-size: var(--fs-small);
  line-height: 1.75;
}
#instr .row .k {
  color: var(--label);
  letter-spacing: .1em;
  text-transform: uppercase;
  white-space: nowrap;
}
#instr .row .v {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* title block -------------------------------------------------------------- */

#titleblock {
  right: calc(var(--pad) * 1.9);
  bottom: calc(var(--pad) * 1.7);
  width: clamp(330px, 30vw, 530px);
}
/*
   A drawing's title block has never had a heading over it — the cells name
   themselves. It gets one here only so it can be folded away like the other
   two, and the layouts that keep it open on a wide screen hide the header
   again. See the variant blocks at the foot of this file.
*/
#titleblock > h2 { border-bottom: 1.4px solid var(--rule); }
#titleblock .tb-org {
  padding: 6px 12px 7px;
  border-bottom: 1px solid #aeb9c9;
}
#titleblock .tb-org .k {
  font-size: var(--fs-micro); letter-spacing: .18em;
  color: var(--label); text-transform: uppercase;
}
#titleblock .tb-org .v {
  font-size: var(--fs-small); font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  line-height: 1.4; margin-top: 2px;
}
#titleblock .tb-title { padding: 8px 12px 9px; }
#titleblock .tb-title .k {
  font-size: var(--fs-micro); letter-spacing: .18em;
  color: var(--label); text-transform: uppercase;
}
#titleblock .tb-title .v {
  font-size: var(--fs-body); font-weight: 700;
  letter-spacing: .13em; text-transform: uppercase;
  line-height: 1.45; margin-top: 3px;
}
#titleblock .cells {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1.4px solid var(--rule);
}
#titleblock .cell {
  padding: 5px 9px 7px;
  border-right: 1px solid #aeb9c9;
  min-width: 0;
}
#titleblock .cell:nth-child(4n) { border-right: 0; }
#titleblock .cell:nth-child(n+5) { border-top: 1px solid #aeb9c9; }
#titleblock .cell .k {
  font-size: var(--fs-micro); letter-spacing: .13em;
  color: var(--label); text-transform: uppercase;
}
#titleblock .cell .v {
  font-size: var(--fs-small); font-weight: 700;
  letter-spacing: .01em; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#titleblock .cell .v.status { color: var(--accent); }

/* console ------------------------------------------------------------------ */

/*
   The console is the BOX — position, rule, paper. `.rail` inside it is the
   thing that scrolls, and the two are separate so the fade at the rail's ends
   does not also fade the arrows drawn over them. See `.railEdge`.
*/
#console {
  position: absolute;
  left: calc(var(--pad) * 1.9);
  bottom: calc(var(--pad) * 1.7);
  background: color-mix(in srgb, var(--panel) 93%, transparent);
  border: 1.4px solid var(--rule);
  padding: 7px 9px;
  max-width: calc(100vw - var(--pad) * 3.8);
}
/* Each row holds one rail and that rail's two arrows. The arrows are
   positioned against the ROW, which is not the scroller, so they stay put
   while it moves and the rail's mask cannot reach them. */
/* `min-width: 0` or the row refuses to be narrower than its content, the rail
   inside it never clips, and there is no overflow for the scroller to scroll —
   the same trap the console itself fell into before `width: auto`. */
#console .railRow { position: relative; min-width: 0; }
#console .rail { min-width: 0; }
#console .rail {
  display: grid;
  gap: 5px;
}

/*
   "There is more this way."

   Hidden unless the rail can actually go that way — `chrome.mjs` writes which
   on `#console` as `data-scroll`, since CSS cannot ask a scroller where it has
   got to. `pointer-events: none` on purpose: these sit over the end buttons,
   and an indicator that swallowed a press aimed at the control underneath
   would cost more than it explains.
*/
.railEdge {
  position: absolute;
  top: 0; bottom: 0;
  width: 26px;
  display: none;
  place-items: center;
  pointer-events: none;
  color: var(--ink);
  opacity: .62;
  z-index: 2;
}
.railEdge[data-edge="start"] { left: 0; }
.railEdge[data-edge="end"]   { right: 0; }
/* Only toward an end the rail has not reached. An arrow pointing back the way
   you came, or one on a rail that fits, teaches a reader to ignore them. */
.railRow[data-scroll="middle"] .railEdge,
.railRow[data-scroll="start"] .railEdge[data-edge="end"],
.railRow[data-scroll="end"]   .railEdge[data-edge="start"] { display: grid; }
.railEdge[data-edge="start"] .ic { transform: rotate(180deg); }
.railEdge .ic { width: 15px; height: 15px; }
.ctrlRow { display: flex; align-items: center; gap: 5px; min-width: 0; }
.ctrlRow > .rowLabel {
  width: 52px; flex: none;
  font-size: var(--fs-micro);
  letter-spacing: .18em;
  color: var(--label);
  text-transform: uppercase;
}

/*
   A console button.

   Square and ink-ruled, in the sheet's own weights — the reference for this is
   a rack of drawing instruments, not a floating pill bar, and a rounded glass
   toolbar would be a second design language arguing with the frame around it.

   The word stays in the document at every width. On a desk it is hidden and a
   tooltip carries it, because a mouse can hover and the glyph alone keeps the
   toolbar compact. On a touchscreen nothing hovers, so the word comes back
   under the icon — an unlabelled icon there is a guess, not a control.
*/
.btn {
  font: inherit;
  font-size: var(--fs-small);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--paper-hi);
  border: 1.2px solid var(--ink);
  padding: 0;
  min-width: var(--hit);
  height: var(--hit);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  transition: background .12s, color .12s;
}
.btn > .ic { pointer-events: none; }
.btn .btnLabel {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.btn:hover { background: #dde5ee; }
.btn.on { background: var(--active); color: #f2f6fb; border-color: var(--active); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* A language button has no glyph: the endonym IS the glyph. */
.btn.lang {
  text-transform: none; letter-spacing: .06em;
  min-width: 44px; padding: 0 8px;
}

/* tooltips ----------------------------------------------------------------- */

/*
   Hover-capable pointers only. On a phone the toolbar scrolls sideways inside
   its own box, which would clip a bubble anchored to a button — and there is
   nothing to hover with anyway. That is exactly the case where the label under
   the icon is showing instead.
*/
@media (hover: hover) and (pointer: fine) {
  .btn[data-tip]::after,
  .panelToggle[data-tip]::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%; bottom: calc(100% + 7px);
    transform: translateX(-50%);
    padding: 4px 8px 5px;
    background: var(--ink);
    color: var(--paper-hi);
    font-size: var(--fs-micro);
    letter-spacing: .1em;
    text-transform: none;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s .35s;
    z-index: 9;
  }
  .btn[data-tip]:hover::after,
  .btn[data-tip]:focus-visible::after,
  .panelToggle[data-tip]:hover::after,
  .panelToggle[data-tip]:focus-visible::after { opacity: 1; }
}

/* captions ----------------------------------------------------------------- */

#viewCaption {
  position: absolute;
  left: 50%; bottom: calc(var(--pad) * 2.6);
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s;
}
#viewCaption.show { opacity: 1; }
#viewCaption .c {
  font-size: var(--fs-body); font-weight: 700;
  letter-spacing: .3em; text-transform: uppercase;
}
#viewCaption .c::before,
#viewCaption .c::after {
  content: ''; display: block;
  height: 1px; background: var(--ink);
  width: 62%; margin: 0 auto 6px;
}
#viewCaption .c::after { margin: 6px auto 0; }
#viewCaption .s {
  font-size: var(--fs-micro); letter-spacing: .12em;
  color: var(--label); margin-top: 5px;
}

#hint {
  position: absolute;
  left: 50%; bottom: calc(var(--pad) * 1.1);
  transform: translateX(-50%);
  font-size: var(--fs-micro);
  letter-spacing: .26em;
  color: #a6b2c4;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
}

/* ------------------------------------------------------- stepping aside */

#key, #instr, #titleblock {
  transition: opacity .25s ease, visibility .25s, transform .25s var(--ease);
}

/* Plate mode: an orthographic elevation gets the sheet to itself.
   This sits ON TOP of whatever the reader chose — a plate is a plate even if
   the legend was pinned open a moment earlier — so it is written as its own
   rule rather than folded into the open/shut states above. */
#sheet.plate #key,
#sheet.plate #instr {
  opacity: 0;
  visibility: hidden;
}

/*
   The picture is being turned over. Everything that is text sitting on top of
   the drawing leaves for as long as that lasts, and comes back the moment it
   stops — the console does not, because it is what the reader's hand is on.

   `.busy` is raised off the annotation layer's own fade, so the panels and the
   balloons go and return together rather than on two clocks that nearly agree.
*/
#sheet.busy #key,
#sheet.busy #instr,
#sheet.busy #titleblock {
  opacity: 0;
  visibility: hidden;
  transition-duration: .16s;
}
#sheet.busy #viewCaption { opacity: 0; }

/* hover card --------------------------------------------------------------- */

#hoverCard {
  position: absolute;
  pointer-events: none;
  background: var(--paper-hi);
  border: 1.3px solid var(--accent);
  border-left-width: 3px;
  padding: 6px 11px 7px;
  max-width: 300px;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity .12s, transform .12s;
  z-index: 5;
}
#hoverCard.show { opacity: 1; transform: none; }
#hoverCard .n {
  font-size: var(--fs-small); font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent);
}
#hoverCard .d {
  font-size: var(--fs-micro);
  color: var(--ink-soft);
  margin-top: 3px;
  line-height: 1.4;
}
#hoverCard .m {
  font-size: var(--fs-micro);
  color: var(--label);
  margin-top: 4px;
  letter-spacing: .1em;
  text-transform: uppercase;
}

/* annotation layer --------------------------------------------------------- */

#ann .leader     { stroke: var(--ink); stroke-width: 1; fill: none; stroke-linejoin: round; }
#ann .leader.occ { stroke-dasharray: 4 3; opacity: .55; }
#ann .leader.hot { stroke: var(--accent); stroke-width: 1.5; }

/* The leader terminates on a dot, not an arrowhead — matches the reference. */
#ann .anchorDot     { fill: var(--ink); stroke: none; }
#ann .anchorDot.hot { fill: var(--accent); }
#ann .balloon    { fill: color-mix(in srgb, var(--paper-hi) 88%, transparent); stroke: var(--ink); stroke-width: 1.2; }
#ann .balloon.hot{ stroke: var(--accent); stroke-width: 1.6; }
#ann .bnum {
  fill: var(--ink);
  font: 700 10px var(--mono);
  text-anchor: middle;
  dominant-baseline: central;
}
#ann .bnum.hot { fill: var(--accent); }

/* Dimension lines are 3D geometry; only the label lives here, and it stays
   horizontal however steeply the line runs. */
#ann .dimlabel {
  fill: #2c6d5d;
  font: 700 10.5px var(--mono);
  letter-spacing: .1em;
  text-anchor: middle;
  dominant-baseline: central;
  paint-order: stroke;
  stroke: var(--paper);
  stroke-width: 5px;
  stroke-linejoin: round;
}

#ann .partOutline { stroke: var(--accent); stroke-width: 1.6; fill: none; opacity: .9; }

/* ------------------------------------------------------------------ chinese */

/*
   The drafting look leans on uppercase and wide tracking, and neither belongs
   on Chinese: the glyphs are already square and full-width, uppercase only
   shouts at the Latin fragments mixed in, and .24em of tracking on four
   characters reads as four separate words. Same layout, different typography.
*/
html[lang^="zh"] .docTitle .t,
html[lang^="zh"] .panel > h2,
html[lang^="zh"] #key .meta,
html[lang^="zh"] #instr .row .k,
html[lang^="zh"] #titleblock .tb-org .k,
html[lang^="zh"] #titleblock .tb-org .v,
html[lang^="zh"] #titleblock .tb-title .k,
html[lang^="zh"] #titleblock .tb-title .v,
html[lang^="zh"] #titleblock .cell .k,
html[lang^="zh"] .ctrlRow > .rowLabel,
html[lang^="zh"] .btn,
html[lang^="zh"] #hoverCard .n,
html[lang^="zh"] #hoverCard .m {
  text-transform: none;
  letter-spacing: .08em;
}
/* The centred caption is the one place the air is the point. */
html[lang^="zh"] #viewCaption .c { text-transform: none; letter-spacing: .22em; }
html[lang^="zh"] #hint { text-transform: none; letter-spacing: .16em; }
html[lang^="zh"] .brand .division,
html[lang^="zh"] .docTitle .s,
html[lang^="zh"] #viewCaption .s { letter-spacing: .04em; }
html[lang^="zh"] #key .tx { line-height: 1.4; }
html[lang^="zh"] .btn[data-tip]::after,
html[lang^="zh"] .panelToggle[data-tip]::after { letter-spacing: .06em; }

/* ======================================================================
   LAYOUTS

   Three ways of fusing the same two ideas — keep the sheet and let it step
   aside, or fold it away and call it back. They share every rule above and
   differ only in where the console sits and which panels a width opens with.
   ====================================================================== */

/*
   Nothing on the glass but the frame, the title, the drawing and the toolbar.
   Every panel is one press away, and a phone and a desk get the same layout —
   which is the whole argument for it. Two other arrangements were carried here
   while the direction was being chosen; this is the one that was picked.
*/

#sheet {
  --panel-key: shut; --panel-instr: shut; --panel-tb: shut;
}

/*
   The toolbar is centred by AUTO MARGINS, not by a transform.

   A transformed element becomes the containing block for any `position: fixed`
   descendant, which silently re-anchors it to the toolbar instead of to the
   window. That cost an afternoon when a panel rail was nested in here; auto
   margins centre the box without creating the trap.
*/
#console {
  left: 0; right: 0;
  width: max-content;
  max-width: calc(100vw - var(--pad) * 3.8);
  margin-inline: auto;
}
/* Side by side, so the split into two rails is invisible where everything
   fits on one line anyway — and `flex: none` on the rows, because here the
   point is that nothing is clipped at all. */
#console {
  display: flex;
  align-items: center;
  gap: 9px;
}
#console .railRow { flex: none; }
#console .rail {
  grid-auto-flow: column;
  align-items: center;
  gap: 9px;
}
#console .railRow + .railRow {
  border-left: 1px solid color-mix(in srgb, var(--ink) 32%, transparent);
  padding-left: 9px;
}
#console .ctrlRow + .ctrlRow {
  border-left: 1px solid color-mix(in srgb, var(--ink) 32%, transparent);
  padding-left: 9px;
}
/* The groups are told apart by the rules between them and by the glyphs
   themselves; a word in front of each is a third way of saying it. */
#console .rowLabel { display: none; }

/* Every panel is reached from the toolbar here, the title block included, so
   it carries a header like the other two. */
#titleblock > h2 { display: flex; }
/* The readouts keep the corner; language tucks under them. */
#sheet[data-panel-instr="shut"] #instr { top: calc(var(--pad) * 4.5); }
#langDock { top: calc(var(--pad) * 4.5 + var(--hit) + 8px); }

/* ======================================================================
   WIDTHS
   ====================================================================== */

/* --- tablet ---------------------------------------------------------------- */

@media (max-width: 1199px) {
  #key { width: min(42vw, 330px); }
  #key .items { grid-template-columns: 1fr; }
  #instr { width: min(32vw, 260px); }
  #titleblock { width: min(46vw, 400px); }
  #titleblock .cells { grid-template-columns: repeat(2, 1fr); }
  #titleblock .cell:nth-child(4n) { border-right: 1px solid #aeb9c9; }
  #titleblock .cell:nth-child(2n) { border-right: 0; }
  #titleblock .cell:nth-child(n+3) { border-top: 1px solid #aeb9c9; }

}

/* --- phone ----------------------------------------------------------------- */

@media (max-width: 767px) {
  :root {
    --pad: 10px;
    --ic: 19px;
    --hit: 38px;
    /*
       Raised from 9 / 10.5 / 11.5. The scale above is tuned for a sheet read at
       arm's length on a desk; the same numbers on a phone held at reading
       distance are a third smaller than anything else on the device, and the
       legend is the part a reader actually has to read.
    */
    --fs-micro: 10.5px;
    --fs-small: 12.5px;
    --fs-body:  13.5px;
    --fs-title: 13px;
  }

  /* Pure decoration, and at this width it is the only thing on the paper that
     is not either the drawing or a control. */
  .zone { display: none; }

  /*
     The heading is two facts fighting for one line: who issued the sheet, and
     what it is of. At this width only one of them can be full size, and on a
     drawing that is the subject — so the byline shrinks to the micro size and
     is allowed to clip, and the title keeps the rest.
  */
  .brand {
    left: var(--pad); top: var(--pad); gap: 6px;
    max-width: 40%;
  }
  .brand .mark { width: 20px; height: 20px; }
  .brand .division { display: none; }
  .brand .sig {
    font-size: var(--fs-micro);
    letter-spacing: .02em;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .docTitle {
    right: var(--pad); top: var(--pad);
    max-width: calc(58% - var(--pad));
  }
  .docTitle .s { display: none; }
  .docTitle .t {
    letter-spacing: .06em;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }

  /* An open panel covers the drawing here rather than sitting beside it, and
     the card that names a part docks to an edge instead of chasing a finger.
     Both are read back by the runtime — see the declarations at the top, and
     `--card-docked` in particular for what happens when they disagree. */
  #sheet { --panel-overlay: yes; --card-docked: yes; }

  /*
     AN OPEN PANEL ON A PHONE IS A DRAWER, and the drawing stays in sight.

     Two earlier attempts are worth recording. Half-covering the sheet put the
     card exactly over the centred model and left blank paper above it. Taking
     the whole page fixed that and created a worse problem — nothing of the
     drawing survived, so there was no sense of still being on it, and with the
     handle briefly unhittable there was no way back either.

     A drawer rising from the bottom edge keeps the top of the sheet, and the
     runtime lifts the model into that band while one is open (see
     `setViewOffset`) so what is left visible is the subject rather than margin.
  */
  #sheet[data-panel-key="open"]   #key,
  #sheet[data-panel-instr="open"] #instr,
  #sheet[data-panel-tb="open"]    #titleblock {
    position: fixed;
    left: 0; right: 0;
    top: auto;
    bottom: calc(var(--hit) + var(--pad) * 3.4);
    width: auto;
    height: 60vh;
    height: 60dvh;
    max-height: none;
    overflow: auto;
    overscroll-behavior: contain;
    /* Opaque: a surface this size is being READ, and the model showing faintly
       through forty lines of legend is texture behind text, not context. */
    background: var(--panel);
    border: 0;
    border-top: 1.6px solid var(--rule);
    box-shadow: 0 -12px 34px -14px color-mix(in srgb, var(--ink) 55%, transparent);
    z-index: 6;
  }
  /* The other two handles stay reachable on top of it, so the panels read as
     three tabs of one surface rather than three separate errands. */
  #sheet[data-panel-key="shut"]   #key,
  #sheet[data-panel-instr="shut"] #instr,
  #sheet[data-panel-tb="shut"]    #titleblock { z-index: 8; }
  #sheet[data-panel-key="open"] #key > h2,
  #sheet[data-panel-instr="open"] #instr > h2,
  #sheet[data-panel-tb="open"] #titleblock > h2 {
    position: sticky; top: 0; z-index: 1;
    display: flex;
  }

  /*
     The tap-anywhere-else target.

     Transparent on purpose — the whole point of the drawer is that the drawing
     is still there to look at, and dimming it to signal modality would undo
     that. It also stops a tap above the drawer orbiting the model when what the
     reader meant was "put this away".
  */
  #sheet[data-any-panel="open"] #scrim { display: block; }

  /* Folded, they are handles parked in the corners they came from. */
  #sheet[data-panel-key="shut"]   #key        { left: var(--pad); top: calc(var(--pad) * 4.6); }
  #sheet[data-panel-instr="shut"] #instr      { right: var(--pad); top: calc(var(--pad) * 4.6); width: auto; }
  #sheet[data-panel-tb="shut"]    #titleblock { right: var(--pad); top: calc(var(--pad) * 4.6 + var(--hit) + 6px); bottom: auto; width: auto; }
  /* Third in the right-hand column, under the readouts and the title block. */
  #langDock {
    right: var(--pad);
    top: calc(var(--pad) * 4.6 + (var(--hit) + 6px) * 2);
  }
  #langDock .btn { height: var(--hit); padding: 0 8px; }
  /* One button naming where it takes you: there is no room beside three panel
     handles for one per language. */
  #langDock .langAll { display: none; }
  #langDock .langCycle { display: block; }

  #key .items { padding: 8px 8px 8px 8px; }

  /* A drawer is the reading surface, so its contents get a step more than the
     furniture around them. */
  #sheet[data-panel-key="open"]   #key .item,
  #sheet[data-panel-instr="open"] #instr .row,
  #sheet[data-panel-tb="open"]    #titleblock .cell .v { font-size: 13.5px; }
  #sheet[data-panel-key="open"] #key .item { padding: 5px 6px 5px 0; }
  #sheet[data-panel-key="open"] #key .bal { width: 20px; height: 20px; font-size: 11px; }
  #sheet[data-panel-instr="open"] #instr .rows { padding: 10px 14px 12px; }
  #sheet[data-panel-instr="open"] #instr .row { line-height: 2; }
  #titleblock .cells { grid-template-columns: repeat(2, 1fr); }

  /*
     One strip along the bottom edge, scrolling sideways. Five stacked rows of
     controls would take a quarter of the screen; a single strip takes one
     button's worth and the groups stay in their drafting order, ruled apart.
  */
  /*
     TWO ROWS here, and only here. A wide sheet fits the whole toolbar on one
     line — `data-scroll` reports `none` and no arrow ever shows — so splitting
     it there would buy nothing and cost a line of height.
  */
  #console {
    display: grid;
    grid-auto-flow: row;
    gap: 4px;
    left: var(--pad); right: var(--pad);
    bottom: var(--pad);
    /*
       `width: auto` matters as much as the overflow below it.

       The wide layout sizes this box to `max-content` so it can be centred by
       auto margins. Left as that here it grows to fit all eleven buttons —
       1070px on a 390px screen — and a box as wide as its content has no
       overflow, so `overflow-x` has nothing to scroll and the far end is simply
       off the screen with no way to reach it. Being clipped by `left`/`right`
       is what makes it a rail.
    */
    width: auto;
    max-width: none;
    padding: 5px 6px;
  }
  #console .railRow + .railRow { border-left: 0; padding-left: 0; }
  #console .rail {
    display: flex;
    grid-auto-flow: unset;
    align-items: stretch;
    gap: 0;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    /* Let a flick carry rather than stopping dead at the finger. */
    -webkit-overflow-scrolling: touch;
    /* A snap that lands a flick on a group boundary rather than mid-button. */
    scroll-snap-type: x proximity;
    scroll-padding: 0 10px;
  }

  /*
     The fade goes where there is something to fade INTO.

     A gradient at both ends regardless would dim the first button while the
     rail is already at its start, which says "cut off" about something that is
     not — and it is the selected view button that sits there. So the mask
     follows the same `data-scroll` the arrows do.
  */
  .railRow[data-scroll="start"] .rail {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(to right, #000 calc(100% - 26px), transparent 100%);
  }
  .railRow[data-scroll="end"] .rail {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 26px);
    mask-image: linear-gradient(to right, transparent 0, #000 26px);
  }
  .railRow[data-scroll="middle"] .rail {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 26px,
                        #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 26px,
                #000 calc(100% - 26px), transparent 100%);
  }
  #console .rail::-webkit-scrollbar { display: none; }
  #console .ctrlRow { scroll-snap-align: start; }
  /* `flex: none` on both levels or there is no overflow to scroll: flex would
     rather crush eleven buttons into the width it has than admit they do not
     fit, and the strip silently becomes a pile. */
  #console .ctrlRow { flex: none; gap: 4px; padding: 0 6px; }
  #console .ctrlRow + .ctrlRow {
    border-left: 1px solid color-mix(in srgb, var(--ink) 30%, transparent);
  }
  #console .rowLabel { display: none; }
  #console .btn { flex: none; }

  /* The arrows, shown only toward an end the rail has not reached. The fade
     alone says "something is cut off"; the arrow says which way to push. */


  /* Nothing hovers here, so the name comes out from under the clip and sits
     under its glyph. */
  .btn {
    height: auto;
    min-width: calc(var(--hit) + 6px);
    padding: 5px 4px 4px;
    grid-auto-flow: row;
    gap: 2px;
  }
  .btn .btnLabel {
    position: static;
    width: auto; height: auto;
    margin: 0;
    clip-path: none;
    overflow: visible;
    font-size: 10px;
    letter-spacing: .02em;
    line-height: 1.1;
    /* Enough to tell RUN from DRIVE, not enough for one long name to push the
       rest of the strip off the far end. The tooltip is gone here anyway — the
       full name is in the panel this button opens. */
    max-width: 6ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn.lang { min-width: 40px; padding: 5px 7px; }

  /* Clear of the toolbar, both of them. */
  #viewCaption { bottom: calc(var(--hit) + var(--pad) * 3.2); }
  #hint { display: none; }

  /*
     The card cannot follow a finger — the finger is on top of it. It docks
     above the toolbar instead, full width, where it is legible and is not
     under the hand that summoned it.
  */
  #hoverCard {
    position: fixed;
    left: var(--pad); right: var(--pad);
    bottom: calc(var(--hit) + var(--pad) * 3.4);
    top: auto;
    max-width: none;
    transform: translateY(6px);
    /* A part may carry a long note, and this card cannot be scrolled — it is
       `pointer-events: none` so a finger would scroll the model behind it. Four
       lines is what a caption is for; the legend is where the full text lives.

       `vh` first: a browser that does not know `dvh` drops the whole
       declaration rather than falling back within it, and this page is emitted
       to be opened anywhere, including off a file:// path on whatever is
       installed. The pair costs one line and the cap is never simply absent. */
    max-height: 34vh;
    max-height: 34dvh;
    overflow: hidden;
  }
  #hoverCard .d {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
  }
  #hoverCard.show { transform: none; }
}

/*
   The numbering starts off only on a narrow sheet held UPRIGHT.

   That is where the argument holds: the gutters are horizontal, the width is
   the scarce axis, and a fifth of it is being kept clear for balloons. Turn the
   same phone on its side and there are 740px of width — the gutters cost the
   same fraction of a much larger number, the balloons place perfectly well, and
   there is nothing to buy by hiding them.
*/
@media (max-width: 767px) and (orientation: portrait) {
  #sheet { --layer-callouts: off; }
}

/* --- phone, on its side ------------------------------------------------------
   A short viewport is the case where the toolbar can eat the drawing. The
   controls compress to glyphs again — a landscape phone is 360px tall and
   cannot spare a second line of text under each one. */

@media (max-height: 500px) and (orientation: landscape) {
  :root { --hit: 30px; --ic: 16px; }
  .btn { padding: 0; grid-auto-flow: column; }
  .btn .btnLabel {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
  }
  .brand .sig, .docTitle .s { display: none; }
  /* Landscape: the heading has already been trimmed, so the card may start
     higher up. */
  #sheet[data-panel-key="open"]   #key,
  #sheet[data-panel-instr="open"] #instr,
  #sheet[data-panel-tb="open"]    #titleblock { top: calc(var(--pad) * 3.2); }
}

/* Readers who have asked their system to stop moving things. The sheet still
   steps aside — that is what it is for — it just does it at once. */
@media (prefers-reduced-motion: reduce) {
  .panel, #key, #instr, #titleblock, #hoverCard, #viewCaption,
  .btn, .panelToggle { transition-duration: .01ms !important; }
}
</style>
